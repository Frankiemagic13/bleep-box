name: Build Bleep Box

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Get OBS headers and import library
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = gh release view -R obsproject/obs-studio --json tagName -q .tagName
          Write-Host "Latest OBS: $tag"
          $assets = gh release view $tag -R obsproject/obs-studio --json assets -q '.assets[].name'
          $zipName = $assets | Where-Object { $_ -match 'Windows' -and $_ -match '\.zip$' -and $_ -notmatch 'PDB|pdb|arm64|ARM64' } | Select-Object -First 1
          if (-not $zipName) { throw "No OBS Windows zip found in release $tag" }
          Write-Host "Using $zipName"
          gh release download $tag -R obsproject/obs-studio -p $zipName -D obs-dl
          Expand-Archive (Join-Path obs-dl $zipName) -DestinationPath obs-dl/obs
          $dll = Get-ChildItem obs-dl/obs -Recurse -Filter obs.dll | Select-Object -First 1
          New-Item -ItemType Directory -Force obs-sdk | Out-Null
          $exports = dumpbin /exports $dll.FullName
          $names = foreach ($l in $exports) {
            if ($l -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]{8}\s+(\S+)') { $Matches[1] }
          }
          Write-Host "obs.dll exports: $($names.Count)"
          ("LIBRARY obs`r`nEXPORTS`r`n" + ($names -join "`r`n")) | Set-Content -Encoding ascii obs-sdk/obs.def
          lib /nologo /def:obs-sdk/obs.def /out:obs-sdk/obs.lib /machine:x64
          git clone --depth 1 --branch $tag --filter=blob:none --sparse https://github.com/obsproject/obs-studio.git obs-src
          git -C obs-src sparse-checkout set libobs
          "#pragma once`n#define OBS_DATA_PATH `"`"`n#define OBS_PLUGIN_PATH `"`"`n#define OBS_PLUGIN_DESTINATION `"`"`n" | Set-Content -Encoding ascii obs-src/libobs/obsconfig.h

      - name: Build OBS plugin
        shell: pwsh
        run: |
          cmake -S source/obs-plugin -B build -A x64 -DOBS_INCLUDE_DIR="$PWD/obs-src/libobs" -DOBS_LIB="$PWD/obs-sdk/obs.lib"
          cmake --build build --config Release

      - name: Build app
        shell: pwsh
        run: |
          dotnet publish source/app/BleepBox.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/app

      - name: Package (one BleepBox folder, ready to share)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $d = 'dist/BleepBox'
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item 'START HERE.html', Install.bat, install.ps1, Uninstall.bat, uninstall.ps1 $d
          Copy-Item obs-plugin, app, streamdeck $d -Recurse
          Get-ChildItem $d -Recurse -Filter 'PUT * HERE.txt' | Remove-Item
          Copy-Item build/Release/bleep-box.dll "$d/obs-plugin/bleep-box/bin/64bit/"
          Copy-Item out/app/BleepBox.exe "$d/app/"
          Remove-Item "$d/streamdeck/*.streamDeckPlugin"
          Compress-Archive -Path source/streamdeck/com.frankievalletech.bleepbox.sdPlugin -DestinationPath sd.zip -Force
          Move-Item sd.zip "$d/streamdeck/com.frankievalletech.bleepbox.streamDeckPlugin"

      - uses: actions/upload-artifact@v4
        with:
          name: BleepBox-Share
          path: dist

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path dist/BleepBox -DestinationPath BleepBox-Share.zip

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: BleepBox-Share.zip

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Mac app
        run: bash source/mac/build.sh

      - name: Package
        run: |
          mkdir -p dist-mac/BleepBox-Mac
          cp -R "source/mac/build/Bleep Box.app" dist-mac/BleepBox-Mac/
          cp streamdeck/*.streamDeckPlugin "Mac - READ ME.txt" dist-mac/BleepBox-Mac/
          cd dist-mac && ditto -c -k --keepParent BleepBox-Mac BleepBox-Mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BleepBox-Mac
          path: dist-mac/BleepBox-Mac.zip
